<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0e0d0b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Schwarzmarkt">
<title>Schwarzmarkt</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e0d0b; --panel:#1a1814; --panel2:#24211b; --line:#3a3429;
  --text:#ece4d4; --dim:#9a8f7c; --accent:#e0a526; --accent2:#c0392b; --good:#5fbf6a; --bad:#e2574c;
  --heat:#ff7a2f; --r:12px;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
  font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overscroll-behavior:none}
body{user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
input{font:inherit}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column}

/* ---------- title ---------- */
.title{flex:1;overflow:auto;padding:calc(28px + var(--safe-t)) 16px calc(24px + var(--safe-b));display:flex;flex-direction:column;gap:14px}
.logo{text-align:center;margin:18px 0 6px}
.logo h1{margin:0;font-size:clamp(24px,8.4vw,40px);letter-spacing:.08em;font-weight:900;color:var(--accent);
  text-shadow:0 2px 0 #000,0 0 24px #e0a52633}
.logo p{margin:6px 0 0;color:var(--dim);font-size:13px;letter-spacing:.08em;text-transform:uppercase}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
.field input{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;color:var(--text);outline:none}
.field input:focus{border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;font-weight:600;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.btn.danger{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn.small{padding:8px 10px;font-size:13px}
.btn[disabled]{opacity:.4;pointer-events:none}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left}
.mode b{display:block;font-size:16px;margin-bottom:4px}
.mode span{color:var(--dim);font-size:12.5px}
.mode.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.row{display:flex;gap:10px}
.row>*{flex:1}
.langsw{display:flex;justify-content:center;gap:6px}
.langsw button{background:none;border:1px solid var(--line);border-radius:20px;padding:6px 14px;color:var(--dim);font-size:13px}
.langsw button.on{color:var(--accent);border-color:var(--accent)}

/* ---------- game ---------- */
.top{padding:calc(10px + var(--safe-t)) 16px 10px;background:linear-gradient(#17150f,#0e0d0b);border-bottom:1px solid var(--line)}
.loc{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.loc h2{margin:0;font-size:21px;font-weight:800}
.loc h2 small{font-size:13px;color:var(--dim);font-weight:500;margin-left:6px}
.day{color:var(--accent);font-weight:700;font-size:14px;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.stat{background:var(--panel);border-radius:9px;padding:6px 8px;min-width:0}
.stat i{display:block;font-style:normal;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:4px;border-radius:2px;background:#2c281f;margin-top:4px;overflow:hidden}
.bar>div{height:100%}
.main{flex:1;overflow-y:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.news{background:#2a1f0c;border:1px solid #5a4214;border-radius:var(--r);padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.news.badn{background:#2b1311;border-color:#5e221c}
.news p{margin:0}
.news p+p{margin-top:6px}
.sec{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.1em;margin:14px 2px 8px}
.sec:first-child{margin-top:0}
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;text-align:left;width:100%}
.item:active{background:var(--panel2)}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm span{font-size:12px;color:var(--dim)}
.item .pr{text-align:right;white-space:nowrap}
.item .pr b{display:block;font-size:15px}
.item .pr span{font-size:12px}
.item.off{opacity:.45}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:6px;background:#3a3020;color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.lo{background:#173520;color:var(--good)}
.tag.hi{background:#3a1715;color:var(--bad)}
.up{color:var(--good)}.down{color:var(--bad)}.dim{color:var(--dim)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);background:#13110d;border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.tabs button{background:none;padding:9px 0 10px;color:var(--dim);font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.card h3{margin:0 0 4px;font-size:15px}
.card p{margin:0 0 10px;color:var(--dim);font-size:13px}
.card .row{margin-top:4px}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #2a261e;font-size:14px}
.kv:last-child{border:0}
.endbar{margin-bottom:12px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:flex-end;justify-content:center;z-index:10;animation:fade .15s}
.sheet{background:var(--panel);border-top:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:88%;overflow:auto;
  padding:18px 16px calc(16px + var(--safe-b));animation:slide .2s ease-out}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet .sub{color:var(--dim);font-size:13.5px;margin:0 0 12px}
.sheet .body{font-size:14.5px;margin-bottom:14px}
.sheet .body p{margin:0 0 8px}
.btns{display:flex;flex-direction:column;gap:8px}
.qty{display:flex;align-items:center;gap:8px;margin:10px 0}
.qty button{width:46px;height:46px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:22px;font-weight:700}
.qty input[type=number]{flex:1;min-width:0;text-align:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;height:46px;color:var(--text);font-size:20px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent);margin:6px 0 4px}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.seg button{padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-weight:600;color:var(--dim)}
.seg button.on{background:var(--accent);color:#1a1205;border-color:var(--accent)}
.flog{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;max-height:150px;overflow:auto;margin:8px 0 12px}
.flog p{margin:0 0 3px}
.foes{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}
.foes span{width:22px;height:22px;border-radius:50%;background:var(--accent2);display:inline-block}
.foes span.x{background:#3a2a28}
.toast{position:fixed;left:50%;top:calc(12px + var(--safe-t));transform:translateX(-50%);background:#000e;border:1px solid var(--line);
  padding:9px 14px;border-radius:20px;font-size:13.5px;z-index:20;animation:fade .15s;max-width:90%;text-align:center}
.noanim,.noanim .sheet{animation:none}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 10px;padding:0 16px 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:7px 13px;font-size:13px;color:var(--dim)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#1a1205;font-weight:600}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateY(40px);opacity:0}}
.hs{width:100%;border-collapse:collapse;font-size:14px}
.hs td{padding:7px 4px;border-bottom:1px solid #2a261e}
.hs td:last-child{text-align:right}
.help p{margin:0 0 9px;font-size:14px;color:var(--text)}
</style>
</head>
<body>

/* ================= state ================= */
let S = null;          // game state
let view = 'market';   // active tab
let screen = 'title';  // title | game | highscores | help
let selMode = store.get('sm_mode') || 'campaign';
let selNoDebt = !!store.get('sm_nodebt');
let mcat = 'all';      // market category filter

function newGame(mode, name, noDebt){
  S = {v:1, mode, name: name || t('namePh'), day:1, maxDay: mode === 'campaign' ? CAMPAIGN_DAYS : 0, noDebt:!!noDebt,
    city:'hamburg', cash:2000, bank:0, debt: noDebt ? 0 : 5500, health:100, heat:0, veh:0, guards:0, vest:false,
    cargo:{}, paid:{}, prices:{}, news:[], log:[], over:false};
  genPrices();
  pushNews(t('arrived')(cname('hamburg')));
  save();
}
const save = () => S && store.set('sm_save', S);
const cap = () => VEHICLES[S.veh].cap;
const used = () => Object.entries(S.cargo).reduce((a,[id,n]) => a + n * G[id].size, 0);
const free = () => cap() - used();
const cargoValue = () => Object.entries(S.cargo).reduce((a,[id,n]) => a + n * (G[id].min + G[id].max) / 2, 0);
const netWorth = () => S.cash + S.bank - S.debt + cargoValue();
const score = () => S.cash + S.bank - S.debt;
const rankOf = v => { let r = RANKS[0][1]; for (const [min,n] of RANKS) if (v >= min) r = n; return L(r); };
const diff = () => S.mode === 'endless' ? 1 + (S.day - 1) / 40 : 1 + (S.day - 1) / 90;

function pushNews(msg, bad){ S.news.push({m:msg, bad:!!bad}); S.log.unshift({d:S.day, m:msg}); S.log.length = Math.min(S.log.length, 60); }

function genPrices(){
  const c = C[S.city]; const p = {};
  const ids = GOODS.map(g => g.id);
  // roughly a quarter to 40 % of goods are not on offer today
  const off = new Set(); const nOff = Math.round(ids.length * rnd(.25, .4));
  while (off.size < nOff) off.add(pick(ids));
  for (const g of GOODS){
    if (off.has(g.id) || Math.random() > (g.av ?? 1)) { p[g.id] = null; continue; }
    p[g.id] = Math.max(1, Math.round(rnd(g.min, g.max) * (c.m[g.cat] ?? c.m.heavy) * rnd(.9, 1.1)));
  }
  S.prices = p;
}
function priceTag(id){
  const g = G[id], v = S.prices[id]; if (!v) return '';
  const mid = (g.min + g.max) / 2;
  if (v < mid * .6) return `<span class="tag lo">${t('cheap')}</span>`;
  if (v > mid * 1.45) return `<span class="tag hi">${t('pricey')}</span>`;
  return '';
}

/* ================= world simulation ================= */
function dist(a, b){
  const R = 6371, r = x => x * Math.PI / 180;
  const dLa = r(b.lat - a.lat), dLo = r(b.lon - a.lon);
  const h = Math.sin(dLa/2)**2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo/2)**2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function route(to){
  const km = dist(C[S.city], C[to]);
  // by plane you get anywhere within a day; distance only affects the price
  return {km, days: 1, cost: Math.round((120 + km * .09) * (1 + S.veh * .35))};
}

function dailyTick(){
  S.day++;
  if (S.debt > 0) S.debt = Math.round(S.debt * (1 + DEBT_RATE));
  if (S.bank > 0) S.bank = Math.round(S.bank * (1 + BANK_RATE));
  S.heat = Math.max(0, S.heat - 4);
  if (S.guards > 0){
    const w = S.guards * GUARD_WAGE;
    if (S.cash >= w) S.cash -= w;
    else { S.guards--; pushNews(t('quit'), true); }
  }
}

function travel(to){
  const r = route(to);
  if (S.cash < r.cost) return toast(t('noCash'));
  S.cash -= r.cost;
  S.news = [];
  for (let i = 0; i < r.days; i++) dailyTick();
  S.city = to;
  arrive();
}
function waitDay(){
  S.news = [];
  dailyTick();
  arrive();
}
function arrive(){
  genPrices();
  pushNews(t('arrived')(cname(S.city)));
  // market event
  if (Math.random() < .3){
    const avail = GOODS.filter(g => S.prices[g.id]);
    const g = pick(avail);
    if (Math.random() < .5){
      S.prices[g.id] = Math.max(1, Math.round(S.prices[g.id] * rnd(.2, .4)));
      pushNews(pick(t('crash'))(gname(g.id)));
    } else {
      S.prices[g.id] = Math.round(S.prices[g.id] * rnd(2.5, 4));
      pushNews(pick(t('spike'))(gname(g.id)));
    }
  }
  // found goods
  if (Math.random() < .06 && free() > 0){
    const g = pick(GOODS.filter(g => g.size <= free() && g.cat !== 'heavy' && g.cat !== 'mil'));
    if (g){
      const n = Math.min(rint(2, 8), Math.floor(free() / g.size));
      S.cargo[g.id] = (S.cargo[g.id] || 0) + n;
      S.paid[g.id] = S.paid[g.id] || 0;
      pushNews(t('found')(n, gname(g.id)));
    }
  }
  view = 'market';
  save(); render();
  if (S.mode === 'campaign' && S.day > S.maxDay) return endGame(false);
  maybeEncounter();
}

function maybeEncounter(){
  const d = diff();
  if (S.debt > 15000 && S.day > 8 && Math.random() < .12 + Math.min(.15, S.debt / 1e6))
    return encounter('shark');
  const p = .06 + S.heat / 280 + (S.mode === 'endless' ? Math.min(.18, (S.day - 1) / 500) : 0);
  if (Math.random() >= p) return;
  if (used() > 0 && Math.random() < .55 + S.heat / 400) encounter('customs');
  else encounter('gang');
}

/* ================= encounters & combat ================= */
let F = null; // current fight
function encounter(kind){
  const d = diff();
  const n = clamp(Math.round(rnd(1, 3) * d + (kind === 'customs' ? S.heat / 30 : 0)), 1, 14);
  F = {kind, n, max:n, log:[]};
  const opts = [];
  let title, body;
  if (kind === 'customs'){
    title = t('eCustoms'); body = t('eCustomsD')(n);
    const cost = Math.round(Math.max(500, cargoValue() * .15) * (1 + S.heat / 100));
    opts.push({label:t('bribe')(money(cost)), dis:S.cash < cost, fn:() => { S.cash -= cost; S.heat = clamp(S.heat + 5, 0, 100); done(t('bribed')); }});
    opts.push({label:t('surrender'), fn:() => { S.cargo = {}; S.paid = {}; S.heat = clamp(S.heat + 10, 0, 100); done(t('surrendered'), true); }});
  } else if (kind === 'gang'){
    title = t('eGang'); body = t('eGangD')(n);
    const cost = Math.round(Math.max(300, S.cash * .25));
    opts.push({label:t('payoff')(money(cost)), dis:S.cash < cost, fn:() => { S.cash -= cost; done(t('paidoff')); }});
  } else {
    title = t('eShark'); body = t('eSharkD')(n, money(S.debt));
    const cost = Math.round(Math.min(S.debt, Math.max(1000, S.debt * .2)));
    opts.push({label:t('payShark')(money(cost)), dis:S.cash < cost, fn:() => { S.cash -= cost; S.debt -= cost; done(t('sharkPaid')); }});
  }
  opts.unshift({label:t('fight'), cls:'danger', fn:() => fightScreen()});
  opts.push({label:t('flee'), fn:() => { if (tryFlee()) return; fightScreen(); }});
  modal({title, body:`<p>${body}</p>`, buttons:opts, locked:true});
}
function done(msg, bad){ closeModal(); pushNews(msg, bad); F = null; save(); render(); }

function enemiesShoot(){
  const d = diff();
  for (let i = 0; i < F.n; i++){
    if (Math.random() >= .26 + .03 * d) continue;
    if (S.guards > 0 && Math.random() < .35){ S.guards--; F.log.push([t('guardDown'), 1]); continue; }
    const dmg = Math.round(rint(5, 14) * (S.vest ? .5 : 1) * Math.min(2, .8 + d * .2));
    S.health -= dmg; F.log.push([t('hitYou')(dmg), 1]);
    if (S.health <= 0){ S.health = 0; break; }
  }
}
function tryFlee(){
  const ch = clamp(.55 - F.n * .04 + (S.veh === 0 ? .05 : 0), .12, .7);
  if (Math.random() < ch){
    let msg = t('fled');
    if (F.kind === 'customs'){ S.heat = clamp(S.heat + 12, 0, 100); }
    if (used() > 0 && Math.random() < .35){
      for (const id in S.cargo){ S.cargo[id] = Math.floor(S.cargo[id] * rnd(.5, .85)); if (!S.cargo[id]) { delete S.cargo[id]; delete S.paid[id]; } }
      msg += ' ' + t('lostCargo');
    }
    done(msg);
    return true;
  }
  F.log.push([t('fleeFail'), 1]);
  enemiesShoot();
  return false;
}
function shoot(){
  const shooters = 1 + S.guards;
  let kills = 0;
  for (let i = 0; i < shooters && kills < F.n; i++) if (Math.random() < .42) kills++;
  F.n -= kills;
  F.log.push([kills ? t('youHit')(kills) : t('youMiss'), 0]);
  if (F.n <= 0) return fightWon();
  enemiesShoot();
  fightScreen();
}
function fightWon(){
  let msg = t('won');
  if (F.kind === 'customs'){ S.heat = clamp(S.heat + 30, 0, 100); msg += ' ' + t('customsWon'); }
  else { const l = Math.round(rint(400, 2500) * F.max * diff()); S.cash += l; msg += ' ' + t('loot')(money(l)); }
  done(msg);
}
function fightScreen(){
  if (S.health <= 0){ closeModal(); F = null; return endGame(true); }
  render();
  const foes = Array.from({length:F.max}, (_, i) => `<span class="${i < F.n ? '' : 'x'}"></span>`).join('');
  const log = F.log.slice(-8).map(([m,b]) => `<p class="${b ? 'down' : 'up'}">${m}</p>`).join('');
  modal({
    title: F.kind === 'customs' ? t('eCustoms') : F.kind === 'gang' ? t('eGang') : t('eShark'),
    body:`<div class="kv"><span>${t('enemies')}</span><b>${F.n}</b></div><div class="foes">${foes}</div>
      <div class="kv"><span>${t('health')}</span><b class="${S.health < 35 ? 'down' : ''}">${S.health}</b></div>
      <div class="kv"><span>${t('sGuard')}</span><b>${S.guards}</b></div>
      ${log ? `<div class="flog">${log}</div>` : ''}`,
    buttons:[{label:t('shoot'), cls:'danger', fn:shoot}, {label:t('flee'), fn:() => { if (!tryFlee()) fightScreen(); }}],
    locked:true
  });
}

/* ================= trading ================= */
function trade(id, startMode){
  const g = G[id], price = S.prices[id];
  const own = S.cargo[id] || 0;
  let mode = startMode || (price ? 'buy' : 'sell');
  if (!price) return;
  let q = 0;
  const maxQ = () => mode === 'buy' ? Math.max(0, Math.min(Math.floor(S.cash / price), Math.floor(free() / g.size))) : own;
  const plHtml = () => {
    const paid = S.paid[id];
    if (mode !== 'sell' || q <= 0 || !paid) return '';
    const diffv = (price - paid) * q;
    return `<div class="kv"><span>${diffv >= 0 ? t('profit') : t('loss')}</span><b class="${diffv >= 0 ? 'up' : 'down'} num">${money(diffv)}</b></div>`;
  };
  const upd = () => {
    q = clamp(q, 0, maxQ());
    $('#qn').value = q; $('#qr').value = q;
    $('#tot').textContent = money(q * price);
    $('#pl').innerHTML = plHtml();
    $('.btns .primary').disabled = q <= 0;
  };
  const draw = () => {
    const m = maxQ(); q = clamp(q, 0, m);
    const paid = S.paid[id];
    modal({
      title: gname(id),
      sub: `${t('price')}: <b class="num">${money(price)}</b> ${t('perUnit')} · ${t('size')}: ${g.size}`,
      body: `<div class="seg"><button data-m="buy" class="${mode === 'buy' ? 'on' : ''}">${t('buy')}</button><button data-m="sell" class="${mode === 'sell' ? 'on' : ''}" ${own ? '' : 'disabled style="opacity:.4"'}>${t('sell')}</button></div>
        <div class="kv"><span>${t('own')}</span><b class="num">${fnum(own)}${paid ? ` <span class="dim">(${t('avg')} ${money(paid)})</span>` : ''}</b></div>
        <div class="kv"><span>${mode === 'buy' ? t('cash') : t('space')}</span><b class="num">${mode === 'buy' ? money(S.cash) : `${fnum(used())}/${fnum(cap())}`}</b></div>
        <div class="qty"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="qn" value="${q}" min="0" max="${m}"><button data-d="1">+</button></div>
        <input type="range" id="qr" min="0" max="${m}" value="${q}" ${m ? '' : 'disabled'}>
        <div class="quick"><button class="btn small" data-f="0">0</button><button class="btn small" data-f=".25">25%</button><button class="btn small" data-f=".5">50%</button><button class="btn small" data-f="1">${t('max')}</button></div>
        <div class="kv"><span>${t('total')}</span><b class="num" id="tot">${money(q * price)}</b></div><div id="pl">${plHtml()}</div>
        ${mode === 'buy' && m === 0 ? `<p class="down" style="margin-top:8px">${S.cash < price ? t('noCash') : t('noSpace')}</p>` : ''}`,
      buttons:[{label: mode === 'buy' ? t('buy') : t('sell'), cls:'primary', dis: q <= 0, keep:true, fn: commit}, {label:t('cancel')}]
    });
    const sh = $('.sheet');
    sh.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { mode = b.dataset.m; q = 0; draw(); });
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { q += +b.dataset.d; upd(); });
    sh.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { q = Math.floor(m * +b.dataset.f); upd(); });
    $('#qr').oninput = e => { q = +e.target.value; upd(); };
    $('#qn').oninput = e => { q = Math.floor(+e.target.value || 0); $('#qr').value = q; $('#tot').textContent = money(clamp(q, 0, m) * price); $('#pl').innerHTML = plHtml(); $('.btns .primary').disabled = q <= 0 || q > m; };
    $('#qn').onchange = () => upd();
  };
  const commit = () => {
    q = clamp(q, 0, maxQ());
    if (q <= 0) return;
    if (mode === 'buy'){
      const prevN = S.cargo[id] || 0, prevP = S.paid[id] || 0;
      S.cash -= q * price;
      S.cargo[id] = prevN + q;
      S.paid[id] = Math.round((prevN * prevP + q * price) / (prevN + q));
      pushNews(t('bought')(q, gname(id), money(q * price)));
    } else {
      const paid = S.paid[id] || 0;
      S.cash += q * price;
      S.cargo[id] -= q;
      if (!S.cargo[id]){ delete S.cargo[id]; delete S.paid[id]; }
      const pr = paid ? ` (${(price - paid) >= 0 ? '+' : ''}${money((price - paid) * q)})` : '';
      pushNews(t('sold')(q, gname(id), money(q * price), pr));
    }
    S.heat = clamp(S.heat + q * heatOf(g), 0, 100);
    closeModal(); save(); render();
  };
  draw();
}

/* amount picker for bank / loans / doctor */
function amount(title, sub, max, label, onOk, step){
  step = step || 1;
  max = Math.max(0, Math.floor(max / step) * step);
  let q = max;
  const draw = () => {
    q = clamp(q, 0, max);
    modal({title, sub,
      body:`<div class="qty"><button data-d="-1">−</button><input type="number" inputmode="numeric" id="qn" value="${q}"><button data-d="1">+</button></div>
        <input type="range" id="qr" min="0" max="${max}" step="${step}" value="${q}" ${max ? '' : 'disabled'}>
        <div class="quick"><button class="btn small" data-f="0">0</button><button class="btn small" data-f=".25">25%</button><button class="btn small" data-f=".5">50%</button><button class="btn small" data-f="1">${t('max')}</button></div>`,
      buttons:[{label, cls:'primary', dis:q <= 0, fn:() => { onOk(q); closeModal(); save(); render(); }}, {label:t('cancel')}]});
    const sh = $('.sheet');
    const upd = () => { q = clamp(q, 0, max); $('#qn').value = q; $('#qr').value = q; $('.btns .primary').disabled = q <= 0; };
    sh.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { q += +b.dataset.d * Math.max(step, Math.round(max / 20 / step) * step || step); upd(); });
    sh.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { q = Math.floor(max * +b.dataset.f / step) * step; upd(); });
    $('#qr').oninput = e => { q = +e.target.value; upd(); };
    $('#qn').onchange = e => { q = Math.floor(+e.target.value || 0); upd(); };
  };
  draw();
}

/* ================= end / scores ================= */
function endGame(dead){
  S.over = true;
  const sc = score();
  const hs = store.get('sm_hs') || {campaign:[], endless:[]};
  const list = hs[S.mode] || (hs[S.mode] = []);
  const entry = {n:S.name, s:sc, d:Math.min(S.day, S.maxDay || S.day), dead, nd:!!S.noDebt, ts:Date.now()};
  const isTop = !list.length || sc > Math.max(...list.map(e => e.s));
  list.push(entry); list.sort((a, b) => b.s - a.s); list.length = Math.min(list.length, 10);
  store.set('sm_hs', hs);
  store.del('sm_save');
  render();
  modal({
    title: dead ? t('dead') : t('over'),
    sub: dead ? t('deadD') : t('overD')(entry.d),
    body:`<div class="kv"><span>${t('cash')}</span><b class="num">${money(S.cash)}</b></div>
      <div class="kv"><span>${t('bank')}</span><b class="num">${money(S.bank)}</b></div>
      <div class="kv"><span>${t('debt')}</span><b class="num down">${money(-S.debt)}</b></div>
      <div class="kv"><span>${t('score')}</span><b class="num" style="color:var(--accent);font-size:18px">${money(sc)}</b></div>
      <div class="kv"><span>${t('rank')}</span><b>${rankOf(sc)}</b></div>
      ${isTop && !dead ? `<p style="color:var(--accent);margin-top:10px;font-weight:700">${t('newHS')}</p>` : ''}`,
    buttons:[{label:t('highscores'), cls:'primary', fn:() => { S = null; screen = 'highscores'; closeModal(); render(); }},
             {label:t('toTitle'), fn:() => { S = null; screen = 'title'; closeModal(); render(); }}],
    locked:true
  });
}

/* ================= modal & toast ================= */
function modal({title, sub, body, buttons, locked}){
  const had = document.querySelector('.ov');
  closeModal();
  const ov = document.createElement('div');
  ov.className = 'ov' + (had ? ' noanim' : '');
  ov.innerHTML = `<div class="sheet"><h3>${title}</h3>${sub ? `<p class="sub">${sub}</p>` : ''}<div class="body">${body || ''}</div><div class="btns"></div></div>`;
  const bx = ov.querySelector('.btns');
  (buttons || [{label:t('ok')}]).forEach(b => {
    const el = document.createElement('button');
    el.className = 'btn ' + (b.cls || '');
    el.textContent = b.label;
    if (b.dis) el.disabled = true;
    el.onclick = () => { if (b.fn) b.fn(); else closeModal(); };
    bx.appendChild(el);
  });
  if (!locked) ov.addEventListener('click', e => { if (e.target === ov) closeModal(); });
  document.body.appendChild(ov);
}
function closeModal(){ document.querySelectorAll('.ov').forEach(o => o.remove()); }
let toastT;
function toast(m){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = m;
  document.body.appendChild(el); clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 2200);
}
function confirmBox(q, fn){ modal({title:q, buttons:[{label:t('yes'), cls:'primary', fn:() => { closeModal(); fn(); }}, {label:t('no')}]}); }

    heal:() => amount(t('heal'), t('sDocD')(money(HEAL_PRICE)), Math.min(100 - S.health, Math.floor(S.cash / HEAL_PRICE)), t('heal'), q => { S.cash -= q * HEAL_PRICE; S.health += q; }),
    bribe:() => { S.cash -= bribeCost; S.heat = Math.max(0, S.heat - 30); save(); render(); },
  };
  m.querySelectorAll('[data-a]').forEach(b => b.onclick = A[b.dataset.a]);
  bindFinish(m);
}

function renderMenu(m){
  const inv = Object.entries(S.cargo);
  m.innerHTML = `
    <div class="card">
      <div class="kv"><span>${t('name')}</span><b>${esc(S.name)}</b></div>
      <div class="kv"><span>${t('mode2')}</span><b>${S.mode === 'campaign' ? t('campaign') : t('endless')}</b></div>
      <div class="kv"><span>${t('worth')}</span><b class="num">${money(netWorth())}</b></div>
      <div class="kv"><span>${t('rank')}</span><b>${rankOf(netWorth())}</b></div>
    </div>
    <div class="sec">${t('invent')}</div>
    <div class="card">${inv.length ? inv.map(([id, n]) => `<div class="kv"><span>${gname(id)}</span><b class="num">${fnum(n)}${S.paid[id] ? ` <span class="dim">· ${t('avg')} ${money(S.paid[id])}</span>` : ''}</b></div>`).join('') : `<p style="margin:0">${t('empty')}</p>`}</div>
    <div class="sec">${t('language')}</div>
    <div class="langsw" style="justify-content:flex-start"><button data-l="de" class="${lang === 'de' ? 'on' : ''}">Deutsch</button><button data-l="en" class="${lang === 'en' ? 'on' : ''}">English</button></div>
    <div class="sec">${t('log')}</div>
    <div class="card" style="font-size:13px">${S.log.slice(0, 15).map(l => `<div class="kv"><span>${l.m}</span><b class="dim" style="font-weight:500;padding-left:10px">${l.d}</b></div>`).join('')}</div>
    <div class="list" style="margin-top:14px">
      <button class="btn" data-a="help">${t('howto')}</button>
      <button class="btn" data-a="title">${t('toTitle')}</button>
      <button class="btn danger" data-a="retire">${t('retire')}</button>
    </div>`;
  m.querySelectorAll('[data-l]').forEach(b => b.onclick = () => setLang(b.dataset.l));
  m.querySelector('[data-a=help]').onclick = () => { screen = 'help'; render(); };
  m.querySelector('[data-a=title]').onclick = () => { save(); screen = 'title'; render(); };
  m.querySelector('[data-a=retire]').onclick = () => confirmBox(t('retireQ'), () => endGame(false));
}

function setLang(l){ lang = l; store.set('sm_lang', l); render(); }

function renderTitle(app){
  const saved = store.get('sm_save');
  const canCont = saved && !saved.over;
  app.innerHTML = `<div class="title">
    <div class="logo"><h1>SCHWARZMARKT</h1><p>${t('tagline')}</p></div>
    <div class="langsw"><button data-l="de" class="${lang === 'de' ? 'on' : ''}">Deutsch</button><button data-l="en" class="${lang === 'en' ? 'on' : ''}">English</button></div>
    ${canCont ? `<button class="btn primary" data-a="cont">${t('cont')} · ${esc(saved.name)} · ${t('day')} ${saved.day}</button>` : ''}
    <div class="field"><label>${t('name')}</label><input id="nm" maxlength="20" placeholder="${t('namePh')}" value="${esc(store.get('sm_name') || '')}"></div>
    <div class="field"><label>${t('mode')}</label>
      <div class="modes">
        <button class="mode ${selMode === 'campaign' ? 'sel' : ''}" data-mode="campaign"><b>${t('campaign')}</b><span>${t('campaignD')}</span></button>
        <button class="mode ${selMode === 'endless' ? 'sel' : ''}" data-mode="endless"><b>∞ ${t('endless')}</b><span>${t('endlessD')}</span></button>
      </div></div>
    <div class="field"><label>${t('startCap')}</label>
      <div class="seg" style="margin:0"><button data-debt="1" class="${selNoDebt ? '' : 'on'}">${t('withDebt')}</button><button data-debt="0" class="${selNoDebt ? 'on' : ''}">${t('noDebt')}</button></div>
      <span class="dim" style="font-size:12.5px">${selNoDebt ? t('noDebtD') : t('withDebtD')}</span></div>
    <button class="btn ${canCont ? '' : 'primary'}" data-a="start">${t('start')}</button>
    <div class="row"><button class="btn" data-a="hs">${t('highscores')}</button><button class="btn" data-a="help">${t('howto')}</button></div>
  </div>`;
  app.querySelectorAll('[data-l]').forEach(b => b.onclick = () => setLang(b.dataset.l));
  app.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { selMode = b.dataset.mode; store.set('sm_mode', selMode); render(); });
  app.querySelectorAll('[data-debt]').forEach(b => b.onclick = () => { selNoDebt = b.dataset.debt === '0'; store.set('sm_nodebt', selNoDebt); render(); });
  const nm = $('#nm'); nm.oninput = () => store.set('sm_name', nm.value);
  const start = () => { newGame(selMode, nm.value.trim(), selNoDebt); view = 'market'; mcat = 'all'; screen = 'game'; render(); };
  app.querySelector('[data-a=start]').onclick = () => canCont ? confirmBox(t('overwrite'), start) : start();
  if (canCont) app.querySelector('[data-a=cont]').onclick = () => { S = saved; view = 'market'; screen = 'game'; render(); };
  app.querySelector('[data-a=hs]').onclick = () => { screen = 'highscores'; render(); };
  app.querySelector('[data-a=help]').onclick = () => { screen = 'help'; render(); };
}

let hsTab = 'campaign';
function renderHS(app){
  const hs = store.get('sm_hs') || {};
  const list = hs[hsTab] || [];
  app.innerHTML = `<div class="title">
    <div class="logo"><h1 style="font-size:28px">${t('highscores').toUpperCase()}</h1></div>
    <div class="seg"><button data-t="campaign" class="${hsTab === 'campaign' ? 'on' : ''}">${t('campaign')}</button><button data-t="endless" class="${hsTab === 'endless' ? 'on' : ''}">∞ ${t('endless')}</button></div>
    <div class="card">${list.length ? `<table class="hs num">${list.map((e, i) => `<tr><td class="dim">${i + 1}.</td><td>${e.dead ? '† ' : ''}${esc(e.n)}<br><span class="dim" style="font-size:12px">${rankOf(e.s)} · ${t('day')} ${e.d}${e.nd ? ' · ' + t('noDebtShort') : ''}</span></td><td><b>${money(e.s)}</b></td></tr>`).join('')}</table>` : `<p style="margin:0">${t('noHS')}</p>`}</div>
    <button class="btn" data-a="back">${t('back')}</button></div>`;
  app.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { hsTab = b.dataset.t; render(); });
  app.querySelector('[data-a=back]').onclick = () => { screen = S ? 'game' : 'title'; render(); };
}
function renderHelp(app){
  app.innerHTML = `<div class="title">
    <div class="logo"><h1 style="font-size:28px">${t('howto').toUpperCase()}</h1></div>
    <div class="card help">${t('help').map(p => `<p>${p}</p>`).join('')}</div>
    <button class="btn" data-a="back">${t('back')}</button></div>`;
  app.querySelector('[data-a=back]').onclick = () => { screen = S ? 'game' : 'title'; render(); };
}

render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
